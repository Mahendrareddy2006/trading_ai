services:
  - type: web
    name: trading-ai-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn trading_ai.api.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TRADING_MODE
        value: paper
      - key: DEBUG
        value: false
      - key: ALLOW_PUBLIC_SIGNUP
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://trading-ai-khaki.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: MARKET_DATA_PROVIDER
        value: kraken
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ENABLED
        value: false
      - key: WHATSAPP_PROVIDER
        value: meta
